<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gobierno de Datos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Sistema de Gobierno de Datos</h1>

        <div class="card">
            <div class="card-header">
                <h2>Flujo 1: Validación de Calidad de Archivos</h2>
            </div>
            <div class="card-body">
                <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file-input" class="form-label">Selecciona un archivo</label>
                        <input type="file" class="form-control" name="file" id="file-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Subir y Validar</button>
                </form>
                <div id="validation-result" class="mt-4"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
